<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body class="bg-subtle d-flex align-items-center bg-light min-vh-100">
    <main
      class="bg-body shadow-sm border border-light-subtle rounded w-75 mx-auto"
    >
      <h1 class="text-center m-4 fs-2">Roth IRA Calculator</h1>
      <form class="p-3" action="/submitform">
        <div class="form-group mb-3">
          <label for="balance">Balance ($)</label>
          <input class="form-control" type="text" name="balance" id="balance" />
        </div>
        <div class="form-group mb-3">
          <label for="annual">Annual Contribution ($)</label>
          <input class="form-control" type="text" name="annual" id="annual" />
        </div>
        <fieldset class="mb-3">
          <legend>Maximize contributions?</legend>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="maximize"
              id="yes"
              value="yes"
            />
            <label class="form-check-label" for="yes">Yes</label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="maximize"
              id="no"
              value="no"
            />
            <label class="form-check-label" for="no">No</label>
          </div>
        </fieldset>
        <div class="form-group mb-3">
          <label for="rate">Expected return (%)</label>
          <input class="form-control" type="number" name="rate" id="rate" />
        </div>
        <div class="form-group mb-3">
          <label for="current">Current age</label>
          <input
            class="form-control"
            type="number"
            name="current"
            id="current"
          />
        </div>
        <div class="form-group mb-3">
          <label for="retire">Retirement age</label>
          <input class="form-control" type="number" name="retire" id="retire" />
        </div>
        <div class="form-group mb-3">
          <label for="tax">Tax rate (%)</label>
          <input class="form-control" type="number" name="tax" id="tax" />
        </div>
        <div class="d-flex gap-2">
          <input class="btn btn-primary flex-fill" type="submit" value="Calculate" />
          <input class="btn btn-outline-secondary flex-fill" type="reset" value="Reset" />
        </div>
      </form>
      <footer class="text-center mt-auto footer pt-3 px-3">
        <p>
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://www.calculator.net">Calculator.net</a>
        </p>
      </footer>
    </main>
  </body>
</html>
